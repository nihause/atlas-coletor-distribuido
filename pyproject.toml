[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-worker"
version = "0.1.0"
description = "Coletor distribuído do Atlas/Radar: pede tarefas ao servidor central (API HTTPS autenticada) e devolve os resultados em lotes."
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.6,<3", "pydantic-settings>=2.2,<3", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
atlas-worker = "atlas_worker.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
