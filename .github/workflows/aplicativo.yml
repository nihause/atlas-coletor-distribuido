name: Aplicativo Ubuntu
on:
  push:
    branches: [main, 'feat/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testar-e-empacotar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar bibliotecas Qt no runner temporário
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - run: python -m pip install '.[gui,dev,build-gui]'
      - run: QT_QPA_PLATFORM=offscreen python -m pytest -q
      - run: python scripts/gerar-deb.py --output /tmp/atlas-packages
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-coletor-ubuntu24.04-amd64
          path: /tmp/atlas-packages/*
  publicar-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: testar-e-empacotar
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: atlas-coletor-ubuntu24.04-amd64
          path: /tmp/atlas-packages
      - env:
          GH_TOKEN: ${{ github.token }}
          ATLAS_TAG: ${{ github.ref_name }}
        run: gh release create "$ATLAS_TAG" /tmp/atlas-packages/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
