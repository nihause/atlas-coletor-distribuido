name: Aplicativo Ubuntu
on:
  push:
    branches: [main, 'feat/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testar-e-empacotar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preparar bibliotecas Qt no runner temporário
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 fonts-ubuntu
      - name: Verificar segredos em todo o histórico
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --exit-code 1 .
      - run: python -m pip install '.[gui,dev,build-gui]' pip-audit
      - run: python -m pip check && python -m pip_audit
      - name: Conferir tag e versão
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ATLAS_TAG: ${{ github.ref_name }}
        run: python -c "import os; from atlas_worker import __version__; assert os.environ['ATLAS_TAG'] == 'v'+__version__"

      - run: QT_QPA_PLATFORM=offscreen python -m pytest -q
      - run: python scripts/gerar-deb.py --output /tmp/atlas-packages
      - name: Assinar manifesto oficial
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ATLAS_RELEASE_SIGNING_KEY: ${{ secrets.ATLAS_RELEASE_SIGNING_KEY }}
        run: python scripts/assinar-release.py /tmp/atlas-packages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-coletor-ubuntu24.04-amd64
          path: /tmp/atlas-packages/*
  publicar-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: testar-e-empacotar
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: atlas-coletor-ubuntu24.04-amd64
          path: /tmp/atlas-packages
      - env:
          GH_TOKEN: ${{ github.token }}
          ATLAS_TAG: ${{ github.ref_name }}
        run: |
          test -s /tmp/atlas-packages/manifest.json
          test -s /tmp/atlas-packages/manifest.sig
          if gh release view "$ATLAS_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release já existe; recusando sobrescrita."
            exit 1
          fi
          gh release create "$ATLAS_TAG" /tmp/atlas-packages/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
